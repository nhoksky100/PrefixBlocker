name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất cứ lúc nào

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Tải mã nguồn về máy chủ Mac
        uses: actions/checkout@v4

      - name: Cài đặt XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Tạo file dự án .xcodeproj tự động
        run: |
          xcodegen generate
          test -d ChanSoRac.xcodeproj

      - name: Biên dịch ứng dụng (Build Archive)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ChanSoRac.xcodeproj \
            -scheme ChanSoRac \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/ChanSoRac.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Đóng gói thành file .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/ChanSoRac.xcarchive/Products/Applications/ChanSoRac.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ChanSoRac.ipa Payload
          test -s ChanSoRac.ipa

      - name: Xuất file .ipa để tải về Windows
        uses: actions/upload-artifact@v4
        with:
          name: ChanSoRac-IPA
          path: ChanSoRac.ipa
          if-no-files-found: error
          retention-days: 7