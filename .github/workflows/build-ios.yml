name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất cứ lúc nào

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Tải mã nguồn về máy chủ Mac
        uses: actions/checkout@v4

      - name: Cài đặt XcodeGen
        run: brew install xcodegen

      - name: Tạo file dự án .xcodeproj tự động
        run: xcodegen generate

      - name: Biên dịch ứng dụng (Build Archive)
        run: |
          xcodebuild archive \
            -project ChanSoRac.xcodeproj \
            -scheme ChanSoRac \
            -configuration Release \
            -archivePath build/ChanSoRac.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Đóng gói thành file .ipa
        run: |
          mkdir -p Payload
          cp -r build/ChanSoRac.xcarchive/Products/Applications/ChanSoRac.app Payload/
          zip -r ChanSoRac.ipa Payload

      - name: Xuất file .ipa để tải về Windows
        uses: actions/upload-artifact@v4
        with:
          name: ChanSoRac-IPA
          path: ChanSoRac.ipa