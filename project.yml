name: PrefixBlocker
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.0"

targets:
  PrefixBlocker:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
    entitlements:
      path: App/PrefixBlocker.entitlements
    dependencies:
      - target: CallBlockerExtension

  CallBlockerExtension:
    type: app-extension
    platform: iOS
    sources: [Extension, Shared]
    info:
      path: Extension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    entitlements:
      path: Extension/CallBlockerExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourname.PrefixBlocker