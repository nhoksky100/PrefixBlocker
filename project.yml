name: ChanSoRac
options:
  bundleIdPrefix: com.nhoksky100
  deploymentTarget:
    iOS: 15.0

targets:
  ChanSoRac:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/PrefixBlocker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nhoksky100.ChanSoRac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nhoksky100.ChanSoRac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: CallBlockerExtension

  CallBlockerExtension:
    type: app-extension
    platform: iOS
    sources:
      - Extension
      - Shared
    entitlements:
      path: Extension/CallBlockerExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nhoksky100.ChanSoRac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nhoksky100.ChanSoRac.CallBlockerExtension
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES