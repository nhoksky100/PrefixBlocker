name: PrefixBlocker
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.0"

targets:
  PrefixBlocker:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
    entitlements:
      path: App/PrefixBlocker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourname.PrefixBlocker
    dependencies:
      - target: CallBlockerExtension

  CallBlockerExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Shared
    info:
      path: Extension/Info.plist
    entitlements:
      path: Extension/CallBlockerExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourname.PrefixBlocker