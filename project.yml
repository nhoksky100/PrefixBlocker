name: PrefixBlocker
options:
  bundleIdPrefix: com.nhoksky100
  deploymentTarget:
    iOS: "15.0"

targets:
  PrefixBlocker:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
    entitlements:
      path: App/PrefixBlocker.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nhoksky100.PrefixBlocker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_OUTPUT_FORMAT: xml
    dependencies:
      - target: CallBlockerExtension

  CallBlockerExtension:
    type: app-extension
    platform: iOS
    sources:
      - Extension
      - Shared
    info:
      path: Extension/Info.plist
    entitlements:
      path: Extension/CallBlockerExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nhoksky100.PrefixBlocker.CallBlockerExtension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_OUTPUT_FORMAT: xml